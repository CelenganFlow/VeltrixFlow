<title>Veltrix Flow</title>
<style>
:root{--paper:#e6f7f4;--sf:#ffffff;--ink:#16353f;--mu:#55707a;--ln:#d3eae6;--dk:#0f4c5c;--br:#0b7f78;--br2:#0d8a82;--bar:#14b8a6;--tan:#ff8a6b;--sand:#e1f3f0;--gain:#1f7a3d;--loss:#c62828;--warn:#ffefb0}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 "Segoe UI",system-ui,sans-serif}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside .lo{display:block;width:100%;margin-top:14px;font-size:13px}
aside{background:var(--sf);border-right:1px solid var(--ln);padding:16px;position:sticky;top:0;height:100vh;overflow:auto}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:5px 8px;border-radius:16px;font:inherit;font-weight:600;cursor:pointer;color:var(--ink)}
nav button:hover{background:var(--sand)}nav button.on{background:#0b7f78;color:#fff}
h1,h2,.big{color:var(--dk)}
main{padding:24px;max-width:1100px;width:100%;min-width:0}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;margin-top:16px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:18px;grid-column:span 12;min-width:0}
.card.mint{background:#c9f0e9;border-color:#c9f0e9}.card.peach{background:#ffd6cb;border-color:#ffd6cb}.card.lemon{background:#ffefb0;border-color:#ffefb0}
.card.mint .mu,.card.peach .mu,.card.lemon .mu{color:#3f5a63}
.c12{grid-column:span 12}.c6{grid-column:span 6}.c4{grid-column:span 4}.c5{grid-column:span 5}.c7{grid-column:span 7}.c8{grid-column:span 8}
h1{margin:0;font-size:22px}h2{margin:0 0 10px;font-size:15px}
.mu{color:var(--mu)}.big{font-size:28px;font-weight:700}.gain{color:var(--gain)}.loss{color:var(--loss)}
.bar{height:12px;border-radius:9px;background:var(--sand);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:var(--bar)}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--ln);border-radius:10px;background:#fff}
.b{font:inherit;padding:8px 14px;border:0;border-radius:10px;background:linear-gradient(90deg,var(--br),var(--br2));color:#fff;font-weight:600;cursor:pointer}
.g{font:inherit;padding:4px 8px;border:1px solid var(--ln);border-radius:8px;background:#fff;cursor:pointer;margin-right:4px}
.x{border:0;background:none;color:var(--loss);cursor:pointer;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.row>*{flex:1;min-width:120px}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--ln);text-align:left}th{color:var(--mu);font-weight:600;font-size:12px}
.tb{border:1px solid var(--ln);border-radius:12px;border-collapse:separate;border-spacing:0;overflow:hidden;background:#fff}
.tb th{background:var(--sand);color:var(--dk);border-bottom:1px solid var(--ln);padding:9px 12px}
.tb td{padding:10px 12px;border-bottom:1px solid var(--ln);vertical-align:middle}
.tb td+td,.tb th+th{border-left:1px solid #eaf3f1}
.tb tbody tr:last-child>td{border-bottom:0}
.tb tbody tr:nth-child(even){background:#fafdfc}
.mi{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;color:var(--dk)}.mi:hover,.mi:focus-visible{background:var(--sand);outline:0}.mi.d{color:var(--loss)}
.tb.t-or{border-color:#f5d6bd}.tb.t-or th{background:#FFE3CC;color:#8a4a1f;border-bottom-color:#f5d6bd}.tb.t-or td{border-bottom-color:#f7e2d1}.tb.t-or td+td,.tb.t-or th+th{border-left-color:#f9e8da}.tb.t-or tbody tr:nth-child(even){background:#FFF6EE}
.tb.t-lv{border-color:#d9ccee}.tb.t-lv th{background:#E3D9F5;color:#5a3f8a;border-bottom-color:#d9ccee}.tb.t-lv td{border-bottom-color:#e8e0f5}.tb.t-lv td+td,.tb.t-lv th+th{border-left-color:#eee8f8}.tb.t-lv tbody tr:nth-child(even){background:#F7F3FC}
.tb.t-ro{border-color:#f3bdd0}.tb.t-ro th{background:#F9C9DA;color:#8a2f54;border-bottom-color:#f3bdd0}.tb.t-ro td{border-bottom-color:#f8d8e3}.tb.t-ro td+td,.tb.t-ro th+th{border-left-color:#fbe3ec}.tb.t-ro tbody tr:nth-child(even){background:#FFF1F6}
.tb.t-bl{border-color:#bcd9ee}.tb.t-bl th{background:#CFE8F7;color:#1f4f73;border-bottom-color:#bcd9ee}.tb.t-bl td{border-bottom-color:#d6e8f5}.tb.t-bl td+td,.tb.t-bl th+th{border-left-color:#e1eef8}.tb.t-bl tbody tr:nth-child(even){background:#F2F9FD}
.tb.t-bl{border-color:#9ccbe8}.tb.t-bl th{background:#B9DCF2;color:#17466a;border-bottom-color:#9ccbe8}.tb.t-bl td{background:#EAF4FB;border-bottom-color:#cfe4f3}.tb.t-bl tbody tr:nth-child(even) td{background:#DCEEF9}
.tb.t-mt{border-color:#9fd8cd}.tb.t-mt th{background:#B5E8DF;color:#0b5a50;border-bottom-color:#9fd8cd}.tb.t-mt td{background:#EAF8F5;border-bottom-color:#cbece6}.tb.t-mt td+td,.tb.t-mt th+th{border-left-color:#d7f0eb}.tb.t-mt tbody tr:nth-child(even) td{background:#DDF3EE}
.row>.tag{flex:0 0 auto;min-width:0}
.tb.t-yl td{background:#FFF8DC}.tb.t-yl tbody tr:nth-child(even) td{background:#FFF0BF}
.tb.t-yl{border-color:#f0dc8a}.tb.t-yl th{background:#FFF0B8;color:#7a5a00;border-bottom-color:#f0dc8a}.tb.t-yl td{border-bottom-color:#f7ebb4}.tb.t-yl td+td,.tb.t-yl th+th{border-left-color:#faf0c8}.tb.t-yl tbody tr:nth-child(even){background:#FFFAE6}
.tag{padding:2px 7px;border-radius:7px;font-size:12px;font-weight:600;background:var(--warn);color:#6b4a00}.tag.r{background:#f9d9d9;color:var(--loss)}
.lbl{display:block;color:var(--mu);font-size:12px;margin-bottom:2px}
@media(max-width:800px){.app{grid-template-columns:1fr}aside{position:static;height:auto}aside .lo{display:none}nav{display:flex;overflow-x:auto}nav button{white-space:nowrap}.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}

.lg{min-height:100vh;display:flex;background:#c9f0e9;position:relative;overflow:hidden;font-family:'Nunito',"Segoe UI",system-ui,sans-serif;color:#0f4c5c}
.lg .dc{position:absolute;border-radius:50%}
.lg-l{flex:1 1 55%;position:relative;padding:56px 40px 40px 72px;min-height:max(100vh,760px);box-sizing:border-box}
.lg-r{flex:1 1 45%;display:flex;align-items:center;justify-content:center;padding:30px 60px 30px 20px;position:relative;box-sizing:border-box}
.lg-h{margin:18px 0 0;font-size:52px;font-weight:900;line-height:1.06;max-width:430px}
.lg-p{margin:14px 0 0;font-size:18px;line-height:1.5;max-width:380px;color:#2f5f6b}
.lg-box{position:absolute;left:84px;bottom:34px;width:400px;height:330px}
.lg-pig{position:absolute;left:70px;bottom:0}
.lg-bub{position:absolute;left:8px;top:0;background:#fff;border-radius:20px 20px 20px 4px;padding:10px 16px;font-size:15px;font-weight:800;box-shadow:0 5px 0 rgba(15,76,92,.12);line-height:1.3;width:170px}
.lg-card{width:100%;max-width:420px;background:#fff;border-radius:30px;padding:34px 36px 28px;box-shadow:0 10px 0 rgba(15,76,92,.12);display:flex;flex-direction:column;position:relative}
.lg-card label.t{font-size:14px;font-weight:700;margin-bottom:6px}
.lg-card input.i{height:48px;border:2px solid #cfe6e2;border-radius:16px;padding:0 16px;font:600 16px "Nunito","Segoe UI",system-ui,sans-serif;background:#f4fbf9;color:#0f4c5c;margin-bottom:14px;width:100%;box-sizing:border-box}
.lg-card input.i:focus{outline:3px solid #14b8a6;border-color:#14b8a6}
.lg-go{height:54px;border:0;border-radius:18px;background:#0d7f74;color:#fff;font:800 18px "Nunito","Segoe UI",system-ui,sans-serif;cursor:pointer;box-shadow:0 5px 0 #09574f;margin-top:4px}
.lg-go:disabled{opacity:.7;cursor:wait}
.lg-skip{background:none;border:0;color:#0d7f74;font:700 14px "Nunito","Segoe UI",system-ui,sans-serif;cursor:pointer;text-decoration:underline;margin-top:12px;padding:6px}
@media(max-width:860px){.lg{flex-direction:column}.lg-l{padding:26px 22px 0;min-height:0}.lg-h{font-size:32px}.lg-p{font-size:16px}.lg-l{min-height:0}.lg-box{position:relative;left:auto;bottom:auto;width:auto;height:auto;margin-top:14px}.lg-pig{position:relative;left:auto;display:block;margin:6px auto 0;width:220px;height:auto}.lg-bub{position:relative;left:auto;top:auto;width:auto;max-width:260px}.lg .dx{display:none}.lg-r{padding:16px 14px 36px}.lg-card{padding:26px 22px 22px}}

@media(max-width:800px){
 body{font-size:15px}
 .app{grid-template-columns:minmax(0,1fr)}

 .b{min-height:44px;padding:10px 16px}.g{min-height:40px;padding:6px 12px}

 .row>label input,.row>label select{width:100%}

 main table:not([data-keep]){border:0!important;background:none!important;border-radius:0}

 main table:not([data-keep]) td{white-space:normal!important;flex-wrap:wrap;display:flex;justify-content:space-between;align-items:center;gap:10px;border:0!important;padding:3px 12px!important;text-align:right!important;min-width:0;word-break:break-word}
 main table:not([data-keep]) td::before{content:attr(data-label);flex:0 0 36%;text-align:left;font-size:12px;font-weight:600;color:var(--mu)}
 main table:not([data-keep]) td[data-label=""]::before,main table:not([data-keep]) td[data-span]::before{content:none}
 main table:not([data-keep]) td[data-label=""]{justify-content:flex-end}

 main table:not([data-keep]) tr{position:relative}

 main table:not([data-keep]) td:first-child{border-radius:13px 13px 0 0}main table:not([data-keep]) td:last-child{border-radius:0 0 13px 13px}
 main table[data-keep]{width:100%;font-size:12px!important;border-collapse:collapse}
 main table[data-keep] td,main table[data-keep] th{padding:6px 3px!important;vertical-align:top;word-break:break-word}
 main table[data-keep] th,main table[data-keep] td[style*="right"]{white-space:nowrap!important}
 main table[data-keep] td:first-child,main table[data-keep] th:first-child{padding-left:2px!important}
 main table[data-keep] td:last-child,main table[data-keep] th:last-child{padding-right:2px!important}
 main table.acc tr{display:grid!important;grid-template-columns:auto 1fr auto;grid-template-areas:"tg nm sa" "tg jn ct";column-gap:10px;row-gap:2px;align-items:center;padding:8px 10px}
 main table.acc tr td{display:block!important;padding:0!important;text-align:left!important;white-space:normal!important;width:auto!important}
 main table.acc tr td::before{content:none!important}
 main table.acc tr td[data-tg]{position:static!important;grid-area:tg;align-self:center}
 main table.acc tr td:nth-child(2){grid-area:nm;font-size:15px!important;padding:0!important}
 main table.acc tr td:nth-child(3){grid-area:jn;font-size:12px}
 main table.acc tr td:nth-child(4){grid-area:sa;text-align:right!important}
 main table.acc tr td:nth-child(5){grid-area:ct;text-align:right!important}
 main table.acc tr td:last-child:empty{display:none!important}
 main table.acc tr td[data-span]{grid-column:1/-1;grid-area:auto}
 .card{padding:14px}
 .row .ft{order:3}
 .row>span[style*="inline-block"]{flex:0 0 auto;min-width:0}.row>b,.row>.fa{min-width:0}.row>.fa{font-size:16px!important}
 main table:not([data-keep]) td[data-name]{min-height:44px}
 .tb tbody tr:nth-child(even){background:#fff}
 [data-sync-chip]{bottom:82px!important}
