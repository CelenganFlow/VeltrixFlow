 if(s.fv!==2){const t0=ymd(new Date()),fund=[],ab=a=>(a.open||0)+(o.tx||[]).reduce((q,t)=>q+(t.acc===a.id?((t.type==='in'||(t.type==='inv'&&t.dir==='in'))?t.amt:-t.amt):0)+(t.type==='tf'&&t.to===a.id?t.amt:0),0);

const Bar=({v,t})=><div className="bar"><i style={{width:Math.min(100,Math.max(0,v))+'%',background:t==='l'?'var(--loss)':t==='w'?'#ffc93c':undefined}}/></div>;
const bt=p=>p>100?'l':p>80?'w':'';

const SH=n=>{const a=Math.abs(n||0);return a>=1e9?(a/1e9).toFixed(1).replace('.',',')+'M':a>=1e6?(a/1e6).toFixed(1).replace('.',',')+'jt':a>=1e3?Math.round(a/1e3)+'rb':a>0?String(Math.round(a)):''};
function Bars({ms}){const n=Math.max(1,ms.length),mx=Math.max(1,...ms.flatMap(m=>[m.i,m.o])),W=600,H=150,w=W/n,bw=Math.min(46,w*.34);
 return <><svg viewBox={`0 0 ${W} ${H+44}`} style={{width:'100%'}} role="img" aria-label="Pemasukan dan pengeluaran per bulan">
 {ms.map((m,i)=>{const cx=i*w+w/2,hi=m.i/mx*H,ho=m.o/mx*H;return <g key={i}><title>{m.l}: masuk {$(m.i)}, keluar {$(m.o)}</title>
  <rect x={cx-bw-2} y={24+H-hi} width={bw} height={hi} fill="#14B8A6" rx="4"/><rect x={cx+2} y={24+H-ho} width={bw} height={ho} fill="#FF8A6B" rx="4"/>
  <text x={cx-bw/2-2} y={20+H-hi} fontSize="11" fontWeight="600" textAnchor="middle" fill="#0e8f86">{SH(m.i)}</text><text x={cx+bw/2+2} y={20+H-ho} fontSize="11" fontWeight="600" textAnchor="middle" fill="#d9573a">{SH(m.o)}</text>
  <text x={cx} y={H+40} fontSize="12" textAnchor="middle" fill="var(--mu)">{m.l}</text></g>})}</svg>
 <p className="mu" style={{margin:0}}><span style={{color:'#14B8A6'}}>●</span> Pemasukan &nbsp; <span style={{color:'#FF8A6B'}}>●</span> Pengeluaran</p></>}
function Donut({data}){const t=data.reduce((s,x)=>s+x.v,0)||1;let a=0;
 return <svg viewBox="0 0 36 36" width="130" height="130" role="img" aria-label="Alokasi investasi">{data.map(x=>{const p=x.v/t*100,e=<circle key={x.n} cx="18" cy="18" r="15.9155" fill="none" stroke={x.c} strokeWidth="5" strokeDasharray={p+' '+(100-p)} strokeDashoffset={25-a}/>;a+=p;return e})}</svg>}
const Gauge=({p})=><svg viewBox="0 0 140 84" width="140" role="img" aria-label={p+'% menuju FIRE'}><path d="M10 74A60 60 0 0 1 130 74" fill="none" stroke="var(--sand)" strokeWidth="12" strokeLinecap="round" pathLength="100"/>
 <path d="M10 74A60 60 0 0 1 130 74" fill="none" stroke="var(--bar)" strokeWidth="12" strokeLinecap="round" pathLength="100" strokeDasharray={Math.max(p,.5)+' 100'}/><text x="70" y="70" textAnchor="middle" fontSize="22" fontWeight="700" fill="var(--ink)">{p}%</text></svg>;

const ov=o=>Array.isArray(o)?o[0]:o,ol=o=>Array.isArray(o)?o[1]:o;
function Crud({items,fields,cols,onAdd,onDel,extra,empty}){
 const [f,setF]=useState({});
 const val=x=>f[x.k]??(x.t==='d'?ymd(new Date()):x.o?(x.o.length?ov(x.o[0]):''):'');
 const add=e=>{e.preventDefault();const o={id:uid()};for(const x of fields){const v=val(x);o[x.k]=x.t==='n'?num(v):v}
  if(fields.some(x=>x.req&&!o[x.k]))return alert('Lengkapi isian bertanda * dulu.');onAdd(o);setF({})};
 return <><form className="row" onSubmit={add}>{fields.map(x=>x.o?
  <select key={x.k} value={val(x)} title={x.l} onChange={e=>setF({...f,[x.k]:e.target.value})}>{x.o.map(o=><option key={ov(o)} value={ov(o)}>{ol(o)}</option>)}</select>:
  <input key={x.k} type={x.t==='d'?'date':'text'} inputMode={x.t==='n'?'decimal':undefined} title={x.l} placeholder={x.l+(x.req?' *':'')} value={val(x)} onChange={e=>setF({...f,[x.k]:e.target.value})}/>)}
  <button className="b" style={{flex:'0 0 auto'}}>Tambah</button></form>
  <div style={{overflowX:'auto'}}><table><thead><tr>{cols.map(c=><th key={c.h}>{c.h}</th>)}<th/></tr></thead><tbody>
  {items.length?items.map(i=><tr key={i.id}>{cols.map(c=><td key={c.h}>{c.r(i)}</td>)}<td style={{whiteSpace:'nowrap'}}>{extra&&extra(i)}<button className="x" title="Hapus" onClick={()=>confirm('Hapus data ini?')&&onDel(i.id)}>✕</button></td></tr>)
  :<tr><td colSpan={cols.length+1} className="mu">{empty||'Belum ada data.'}</td></tr>}</tbody></table></div></>}

 const [o,setO]=useState(null),r=useRef(null);

 const mS=pm+'-01',mE=pm+'-31',pks=d.pk.filter(p=>!p.arch),aN=id=>(d.accs.find(x=>x.id===id)||{name:'(akun dihapus)'}).name,sm=(arr,fn)=>arr.filter(fn).reduce((s,x)=>s+x.amt,0);

 const addAst=()=>{const n=(prompt('Nama jenis aset baru:')||'').trim();if(!n)return;if(d.ast.some(c=>c.toLowerCase()===n.toLowerCase()))return alert('Jenis itu sudah ada.');setD(x=>({...x,ast:[...x.ast,n]}))};
 const renAst=old=>{const n=(prompt('Nama baru untuk "'+old+'":',old)||'').trim();if(!n||n===old)return;if(d.ast.some(c=>c!==old&&c.toLowerCase()===n.toLowerCase()))return alert('Nama itu sudah dipakai.');
  setD(x=>({...x,ast:x.ast.map(c=>c===old?n:c),ins:x.ins.map(i=>i.cls===old?{...i,cls:n}:i)}))};
 const delAst=old=>{const used=d.ins.filter(i=>i.cls===old).length;if(!used){if(confirm('Hapus jenis "'+old+'"?'))setD(x=>({...x,ast:x.ast.filter(c=>c!==old)}));return}
  const ans=(prompt('"'+old+'" dipakai '+used+' instrumen. Pindahkan ke jenis mana? Ketik nama jenis tujuan:')||'').trim().toLowerCase(),to=d.ast.find(c=>c!==old&&c.toLowerCase()===ans);
  if(!to)return alert('Jenis tujuan tidak ditemukan. Tidak ada yang diubah.');setD(x=>({...x,ast:x.ast.filter(c=>c!==old),ins:x.ins.map(i=>i.cls===old?{...i,cls:to}:i)}))};
 const tyOf=k=>k==='cin'?'in':'out';
 const addCat=k=>{const n=(prompt('Nama kategori '+(k==='cin'?'pemasukan':'pengeluaran')+' baru:')||'').trim();if(!n)return;
  if(d[k].some(c=>c.toLowerCase()===n.toLowerCase()))return alert('Kategori itu sudah ada.');setD(x=>({...x,[k]:[...x[k],n]}))};
 const renCat=(k,old)=>{const n=(prompt('Nama baru untuk "'+old+'":',old)||'').trim();if(!n||n===old)return;
  if(d[k].some(c=>c!==old&&c.toLowerCase()===n.toLowerCase()))return alert('Nama itu sudah dipakai kategori lain.');
  setD(x=>({...x,[k]:x[k].map(c=>c===old?n:c),tx:x.tx.map(t=>t.type===tyOf(k)&&t.cat===old?{...t,cat:n}:t),bud:k==='cout'?x.bud.map(b=>b.cat===old?{...b,cat:n}:b):x.bud,pk:k==='cout'?x.pk.map(p=>p.cat===old?{...p,cat:n}:p):x.pk}))};
 const delCat=(k,old)=>{const used=d.tx.filter(t=>t.type===tyOf(k)&&t.cat===old).length+(k==='cout'?d.bud.filter(b=>b.cat===old).length+d.pk.filter(p=>p.cat===old).length:0);
  if(!used){if(confirm('Hapus kategori "'+old+'"?'))setD(x=>({...x,[k]:x[k].filter(c=>c!==old)}));return}
  const ans=(prompt('"'+old+'" dipakai '+used+' data. Pindahkan ke kategori mana? Ketik nama kategori tujuan:')||'').trim().toLowerCase();
  const to=d[k].find(c=>c!==old&&c.toLowerCase()===ans);if(!to)return alert('Kategori tujuan tidak ditemukan. Tidak ada yang diubah.');
  setD(x=>({...x,[k]:x[k].filter(c=>c!==old),tx:x.tx.map(t=>t.type===tyOf(k)&&t.cat===old?{...t,cat:to}:t),bud:k==='cout'?x.bud.map(b=>b.cat===old?{...b,cat:to}:b):x.bud,pk:k==='cout'?x.pk.map(p=>p.cat===old?{...p,cat:to}:p):x.pk}))};
 const Set=()=>{const S=d.set,sv=(k,p)=>setD(x=>({...x,set:{...x.set,[k]:p}})),

  const imp=e=>{const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);setD(mig(j));alert('Data berhasil dipulihkan.')}catch(x){alert('File cadangan tidak valid.')}};e.target.files[0]&&r.readAsText(e.target.files[0])};
  return <div className="grid" style={{marginTop:0}}><Card t="Asumsi FIRE" c="c7"><div className="row">

   <p className="mu">Proyeksi memakai nilai uang hari ini (return riil setelah inflasi). Pengeluaran tahunan otomatis = rata-rata 90 hari terakhir × 4 (sudah termasuk cicilan dan belanja kartu yang dihitung sebagai biaya).</p></Card>

    {sy.url&&<button className="g" style={{color:'var(--loss)'}} onClick={()=>confirm('Putuskan koneksi Drive di perangkat ini? Data di Drive tidak dihapus.')&&(setSy({url:'',u:'',k:'',rev:0,h:'',last:''}),setSs({st:'idle',msg:''}),(()=>{try{localStorage.removeItem('veltrix_local')}catch(e){}})(),setLg(true))}>Keluar dari Drive</button>}</div>
   {ss.msg&&<div className="mu" role="status" style={{color:ss.st==='err'?'var(--loss)':undefined}}>{ss.msg}{sy.last&&ss.st!=='busy'?' Terakhir tersimpan: '+new Date(sy.last).toLocaleString('id-ID')+'.':''}</div>}
   {ss.st==='conflict'&&<div style={{background:'#fff0b8',borderRadius:12,padding:10,margin:'8px 0'}}><b>Pilih data mana yang dipakai</b><div className="mu" style={{fontSize:12}}>Drive: versi {ss.remote&&ss.remote.rev}{ss.remote&&ss.remote.savedAt?', disimpan '+new Date(ss.remote.savedAt).toLocaleString('id-ID'):''}{ss.remote&&ss.remote.by?' oleh '+ss.remote.by:''}. Yang tidak dipilih akan tertimpa (cadangan otomatis tetap ada).</div>
    <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:6}}><button className="b" onClick={()=>{if(confirm('Pakai data dari Drive dan timpa data di perangkat ini?'))doLoad(true)}}>Pakai data Drive</button><button className="g" onClick={()=>{if(confirm('Pakai data di perangkat ini dan timpa data di Drive?'))doSave(true)}}>Pakai data perangkat ini</button></div></div>}</Card>
  <Card t="Cadangan data"><p className="mu">Data tersimpan di browser ini. Unduh cadangan secara berkala, dan simpan file-nya di tempat aman.</p>

   <button className="g" style={{color:'var(--loss)',padding:'8px 14px'}} onClick={()=>confirm('Hapus SEMUA data? Pastikan sudah punya cadangan.')&&setD(INIT)}>Hapus semua data</button></Card></div>};

 const T=[['dash','Dashboard',Dash,'',''],['cf','Cash Flow',CF,'#c9f0e9','Catat uang masuk dan keluar, tiap akun rapi.'],['bud','Budgeting',Bud,'#ffefb0','Bagi dana ke kantong, pakai pelan-pelan sampai akhir bulan.'],

 return <div className="app"><Sprites/>{chip&&<button data-sync-chip="1" onClick={()=>setTab('set')} title="Buka pengaturan sinkronisasi" style={{position:'fixed',right:14,bottom:14,zIndex:50,border:'1px solid #0f4c5c33',background:chip[1],color:'#0f4c5c',borderRadius:999,padding:'6px 12px',fontSize:12,fontWeight:600,cursor:'pointer'}}>{chip[0]}</button>}<aside><Logo/><nav aria-label="Menu utama">{T.map(([k,l])=><button key={k} className={tab===k?'on':''} aria-label={l} aria-current={tab===k?'page':undefined} onClick={()=>setTab(k)}><span style={{background:tab===k?'#fff':'#e6f7f4',borderRadius:12,width:42,height:42,display:'grid',placeItems:'center',flex:'0 0 42px'}}><NavIcon k={k} s={30}/></span>{l}</button>)}</nav></aside><main>{tab!=='dash'&&<PageHead t={cur}/>}{Page()}</main></div>}
